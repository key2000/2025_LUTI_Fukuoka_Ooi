order: 4
date: "2026-07-29"
title: "外れ値5%カット＋オーディナリークリギング"
method: >
  341ゾーンの逆算値k_iの上下5%を外れ値と判定し、クリギングの学習データから除外（補間対象に回す）。
  残りのゾーンをバリオグラム学習データとして、データなし＋外れ値の全ゾーンへオーディナリー
  クリギングで空間補間する。数式は右のパネルを参照
  （scripts/Fukuoka_LUTI_model_260617.R L.827-962）。
params:
  外れ値判定: "上下5%（quantile 0.05 / 0.95）"
  バリオグラムモデル: "Spherical（range=10000m, nugget=0）"
  試した他モデル: "Exponential（不採用）, Gaussian（外れ値カット後に不安定・不採用）"
metrics:
  クリギング学習データ数: "341ゾーンの中央90%"
  補間対象ゾーン数: "外れ値＋データなしの合計 約500超"
verdict: adopted
note: >
  Gaussianモデルは外れ値カット前のデータにはフィットしたが、カット後は不安定になったため、
  最終的にSphericalモデルを採用（コードにコメントとして経緯を残してある）。
plot: plots/formula.png
