order: 3
date: "2026-07-07"
title: "k_i の解析的逆算に転換"
method: >
  GAでゾーンごとのk_iを探索するのをやめ、@homeデータ（観測家賃・平均床面積×世帯数）を
  目標値として、モデルの床面積関数 A_Fi(k_i) を uniroot でゾーンごとに直接解く方式に転換。
  数式は右のパネルを参照（モデル式は scripts/Fukuoka_LUTI_model_260617.R L.754-793 と同一）。
params:
  求解方法: "uniroot（区間 [0.01, 0.5], tol=1e-8）"
  目標値A_Fi_obs: "平均床面積_i × 世帯数_i"
  目標値r_bar_i: "観測家賃_i ÷ 1000（円/m2 → 千円/m2）"
metrics:
  対象ゾーン数（居住地）: 847
  解が求まったゾーン数: "341（has_data=TRUE）"
  求まらなかったゾーン数: "506（初期値0.1のまま）"
verdict: adopted
note: >
  GAでの852次元探索（→02_ga-800dim）がpopSize=50では収束しなかったことを受けた方針転換。
  データがない506ゾーンは、このあとのクリギング（→04）で補間する前提。
plot: plots/formula.png
