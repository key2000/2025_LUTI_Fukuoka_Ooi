order: 6
date: "2026-08-25"
title: "住宅・土地統計調査（市区町村、2人世帯換算）による床面積の実データ検証"
method: >
  アットホームデータ（メッシュ単位ではサンプル数が少なく信頼性に課題）に代わり、
  住宅・土地統計調査（市区町村別の平均住宅面積・平均世帯人員、1993〜2023年6時点、
  data/area.df.xdr・data/hhn.df.xdr）を実データとして使い、モデルの床面積出力
  （est_ar、全世帯平均、m2/世帯）との整合性を確認する。
  世帯人数の違いを均すため、1人あたり床面積(=面積/世帯人員)を2倍して「2人世帯換算」の
  平均床面積にしてから比較する。モデルは世帯人数の次元を持たない（j は所得階層等ではなく
  従業地ゾーン）ため、モデル側は全世帯平均のest_arをそのまま比較対象とした。
  市区町村比較のため、メッシュ(KEY_CODE)→市区町村の対応付けを
  data/raw/小地域(町丁・字等)/h27ka40.shp（平成27年国勢調査 小地域境界、福岡県全域）を
  溶解して作成（data/city_sf.xdr）し、メッシュ重心が属する市区町村を判定した上で
  国勢調査メッシュ世帯数(obs_household)で加重平均して市区町村単位のモデル床面積を算出した。
  コードは scripts/Fukuoka_LUTI_model_260617.R L.2457以降
  （「床面積の比較（住宅・土地統計調査、市区町村・2人世帯換算）」セクション）。
params:
  対象都道府県コード: "40（福岡県）"
  調査年: "1993, 2003, 2008, 2013, 2018, 2023"
  比較に使う調査年: 2023（モデルの推定時点に最も近いため）
  換算: "1人あたり床面積 × 2 = 2人世帯換算 床面積"
  市区町村集計の重み: obs_household（国勢調査メッシュ世帯数）
metrics:
  住宅・土地統計調査_福岡県内市区町村数: 83（mun grep "^40" 該当行数）
  メッシュ→市区町村マッチ数_study_area内: "857 / 883（key_code_sf、st_within centroid join）"
  床面積_市区町村比較のR2（住宅・土地統計調査2023、2人世帯換算、重みなしcor()^2）: 0.5614
  参考_床面積_メッシュ比較のR2（アットホーム、重みつきweightedCorr、obs_household重み）: 0.2248
  参考_床面積_メッシュ比較のR2（アットホーム、重みなしcor()^2、上と同一arC_fltに対して算出）: 0.0580
  参考_家賃_メッシュ比較のR2（アットホーム、重みつきweightedCorr、obs_household重み）: 0.5460
verdict: adopted
note: >
  モデル本体（5変数GA控え値パラメータ、k_i=0.1固定、L.1-2555相当）を実行してest_ar・
  final_stateを取得し、市区町村比較まで実行済み。
  市区町村単位・住宅土地統計調査（2人世帯換算）とのR2（重みなしcor()^2）は0.5614。
  一方、既存のアットホームデータ・メッシュ単位床面積比較（同じくarC_fltに対する重みなし
  cor()^2）は0.0580しかなく、既存コードが表示している重みつきR²=0.2248
  （obs_household重みのweightedCorr）は世帯数の多いメッシュに引っ張られて底上げされていた
  値だったとわかった。重みなし同士で比べても住宅・土地統計調査（0.5614）はアットホーム
  （0.0580）を大きく上回っており、アットホームデータのサンプル数不足が床面積ズレの一因
  だった可能性をより強く支持する結果。
  一方でfloor_area_mun_comparison_2023.pngを見ると、モデルはほぼ全市区町村で床面積を
  過大推定しており（散布図の大半が1:1線の上側）、特に一部市区町村（推定250m²超）で
  乖離が大きい。なお今回の実行では scripts/Fukuoka_LUTI_model_260617.R L.2122の方針
  （「GA較正のk_i(best_k_i)は使わず固定値0.1とする」）により、03〜05トライアルで
  逆算・クリギング・緩和したゾーン別k_iは使わず全ゾーン一律k_i=0.1で解いている。
  この一律k_i=0.1が過大推定の一因である可能性があり、次のステップとして03〜05の
  ゾーン別k_iを使った場合にこの過大推定が改善するか確認する価値がある（未実施）。
plot: plots/floor_area_mun_comparison_2023.png
